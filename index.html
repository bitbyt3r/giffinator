<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            body {
                margin: 0;
                background-color: rgba(0, 0, 0, 0);
                overflow: hidden;
            }
            .textbox {
                height: 1080px;
                width: 50%;
                position: absolute;
                z-index: 5;
                translate: -100vw 0;
                transition: translate 3s ease-in-out;
            }
            @font-face {
                font-family: sega;
                src: url('NiseSegaSonic.TTF');
            }
            .textbox h1 {
                margin-top: 100px;
                text-align: center;
                font-size: 150px;
                font-family: sega;
                color: white;
            }
            .textbox p {
                text-align: center;
                font-size: 75px;
                font-family: "Montserrat", serif;
                font-optical-sizing: auto;
                font-weight: 500;
                font-style: normal;
                color: white;
            }
            #arrow {
                margin-left: 710px;
                margin-top: 50px;
                width: 500px;
                height: 500px;
            }
            .leftbox {
                --mask: conic-gradient(from -135deg at right,#0000,#000 1deg 89deg,#0000 90deg) 50%/100% 120px;
                -webkit-mask: var(--mask);
                        mask: var(--mask);
                background-color: blue;
                height: 1200px;
                width: 52%;
                position: absolute;
                z-index: 4;
                translate: -100vw 0;
                transition: translate 3s ease-in-out;
                animation-name: slide-up;
                animation-duration: 1s;
                animation-iteration-count: infinite;
                animation-timing-function: linear;
            }
            .leftboxshadow {
                --mask: conic-gradient(from -135deg at right,#0000,#000 1deg 89deg,#0000 90deg) 50%/100% 120px;
                -webkit-mask: var(--mask);
                        mask: var(--mask);
                background-color: black;
                height: 1200px;
                width: 52.3%;
                position: absolute;
                z-index: 3;
                translate: -100vw 0;
                transition: translate 3s ease-in-out;
                animation-name: slide-up;
                animation-duration: 1s;
                animation-iteration-count: infinite;
                animation-timing-function: linear;
            }
            .bottombox {
                background-color: yellow;
                height: 800px;
                width: 100%;
                position: absolute;
                z-index: 2;
                translate: 0 -100vh;
                transition: translate 3s ease-in-out;
            }
            .topbox {
                background-color: red;
                height: 1080px;
                width: 100%;
                position: absolute;
                z-index: 1;
                translate: 0 100vh;
                transition: translate 3s ease-in-out;
            }
            #giffinator {
                height: 980px;
                position: absolute;
                right: 0;
                opacity: 1;
                margin: 50px;
                border: 10px solid #000000;
            }
            .giffinator {
                width: 100%;
                height: 1080px;
                position: absolute;
                z-index: 50;
                translate: 100vw 0;
                transition: translate 3s ease-in-out;
            }
            @keyframes slide-up {
                0% {
                    top: 0;
                }
                100% {
                    top: -120px;
                }
            }
        </style>
    </head>
    <body>
        <div id="giffinatorbox" class="giffinator">
            <img id="giffinator">
        </div>
        <div id="leftbox" class="leftbox">
        </div>
        <div id="leftboxshadow" class="leftboxshadow"></div>
        <div id="textbox" class="textbox">
            <h1>Giffinator</h1>
            <p>Create your own gif at the photo booth below!</p>
            <img id="arrow" src="arrow.png">
        </div>
        <div id="bottombox" class="bottombox"></div>
        <div id="topbox" class="topbox"></div>

        <script type="text/javascript">
            let image = document.getElementById("giffinator");
            let giffinatorbox = document.getElementById("giffinatorbox")
            let textbox = document.getElementById("textbox")
            let leftbox = document.getElementById("leftbox");
            let leftboxshadow = document.getElementById("leftboxshadow");
            let bottombox = document.getElementById("bottombox");
            let topbox = document.getElementById("topbox");

            image.onload = () => {
                giffinatorbox.style.translate = "0 0";
                textbox.style.translate = "0 0";
                leftbox.style.translate = "0 0";
                leftboxshadow.style.translate = "0 0";
                bottombox.style.translate = "0 0";
                topbox.style.translate = "0 0";
                setTimeout(giffinator_clear, 10000);
            };
            function giffinator_clear() {
                giffinatorbox.style.translate = "100vw 0";
                textbox.style.translate = "-100vw 0";
                leftbox.style.translate = "-100vw 0";
                leftboxshadow.style.translate = "-100vw 0";
                bottombox.style.translate = "0 -100vh";
                topbox.style.translate = "0 100vh";
            }
            function giffinator_image(url) {
                const image = document.getElementById("giffinator");
                image.src = url;
            }

            let ws = null;
            function connect() {
                ws = new WebSocket("wss://qxu7pkfy18.execute-api.us-east-1.amazonaws.com/production/");
                ws.onopen = function() {
                    console.log("Websocket Connected")
                };

                ws.onmessage = function(e) {
                    console.log('Message:', e.data);
                    message = JSON.parse(e.data);
                    if (message.hasOwnProperty("url")) {
                        giffinator_image(message.url);
                    }
                };

                ws.onclose = function(e) {
                    console.log('Socket is closed. Reconnect will be attempted in 1 second.', e.reason);
                    setTimeout(function() {
                        connect();
                    }, 1000);
                };

                ws.onerror = function(err) {
                    console.error('Socket encountered error: ', err.message, 'Closing socket');
                    ws.close();
                };
            }
            connect();
        </script>
    </body>
</html>
